name: stock-analysis
version: 0.2.0
description: Point-in-time, evidence-grounded stock analysis
execution:
  default: host-agent
  endpoint_required: false
  standalone_runtime:
    optional: true
delegation:
  reasoning: host-agent
  tools: host-native-first
capabilities:
  - evidence_grounding
  - point_in_time
  - deterministic_calculations
  - structured_reporting
requirements:
  point_in_time: true
  deterministic_calculations: true
workflow:
  - identity
  - as_of
  - evidence
  - financials
  - profitability
  - balance_sheet
  - cash_flow
  - valuation
  - peers
  - drivers
  - risks
  - scenarios
  - report
  - consistency_check
