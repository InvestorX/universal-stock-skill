[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-stock-skill"
version = "0.2.0"
description = "LLM-agnostic stock analysis skill runtime with RRSI-style self-improvement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
